<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Page not found &middot; Karma Play</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --fg: #14140f; --muted: #6b6b63; --line: rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0c; --fg: #ededf0; --muted: #8a8a93; --line: rgba(255,255,255,.14); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  main { max-width: 34rem; }
  .code {
    font-variant-numeric: tabular-nums; letter-spacing: .18em;
    font-size: .78rem; text-transform: uppercase; color: var(--muted);
    margin: 0 0 1.25rem;
  }
  h1 {
    font-size: clamp(1.9rem, 6vw, 2.9rem); line-height: 1.12;
    font-weight: 500; letter-spacing: -0.02em; margin: 0 0 .9rem;
  }
  p { color: var(--muted); margin: 0 0 2rem; }
  a.home {
    display: inline-block; color: inherit; text-decoration: none;
    border: 1px solid var(--line); border-radius: 100px;
    padding: .7rem 1.4rem; font-size: .92rem;
    transition: border-color .25s ease, transform .25s ease;
  }
  a.home:hover, a.home:focus-visible { border-color: currentColor; transform: translateY(-1px); }
  a.home:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .site { margin-top: 2.5rem; font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { a.home { transition: none; } }
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>This page doesn&rsquo;t exist.</h1>
  <p>The link may be out of date, or the address slightly off.</p>
  <a class="home" href="/">Back to Karma Play</a>
  <p class="site">Karma Play</p>
</main>
</body>
</html>
