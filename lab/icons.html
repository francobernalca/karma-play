<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Karma Play icons (lab)</title>
<style>body{margin:0;background:#888} .i{display:block;width:max-content;line-height:0} .i svg{display:block}</style></head>
<body>
<div class="i" id="i180"></div><div class="i" id="i192"></div><div class="i" id="i512"></div><div class="i" id="m512"></div>
<script type="module">
import { appIconSVG } from '../js/art.js';
for (const [id, size, maskable] of [['i180', 180, false], ['i192', 192, false], ['i512', 512, false], ['m512', 512, true]])
  document.getElementById(id).innerHTML = appIconSVG({ size, maskable });
window.__svg = appIconSVG({ size: 512 }).replace(/ width="512" height="512"/, '');
document.body.dataset.ready = '1';
</script></body></html>
