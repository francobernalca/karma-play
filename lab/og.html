<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Karma Play social card (lab)</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og { position: fixed; left: 0; top: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og .scene-host { opacity: 1; }
  .og canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .og .mark { position: absolute; left: 70px; top: 150px; width: 520px; line-height: 0; }
  .og .mark svg { width: 100%; height: auto; }
  .og .line { position: absolute; left: 76px; top: 360px; width: 560px; margin: 0; font: 700 28px/1.35 "Manrope KP", sans-serif; color: #2A2740; }
</style></head>
<body>
<div class="og"><div class="scene scene-host" id="scene"></div><canvas id="stage"></canvas><div class="mark" id="mark"></div>
<p class="line">A free balloon game for toddlers.<br>No ads, no tracking, works offline.</p></div>
<script type="module">
import * as A from '../js/art.js';
import { mountScene } from '../js/scene.js';
import { Stage, balloonColorFor } from '../js/stage.js';
import { makeItem } from '../js/content.js';
mountScene(document.getElementById('scene'), 'home');
document.getElementById('mark').innerHTML = A.wordmarkSVG();
const st = new Stage(document.getElementById('stage'));
await st.prepare();
await document.fonts.ready;
st.R = 62;
const put = (it, color, x, y, rot) => { const b = st.spawn({ item: it, color, x }); b.y = y; b.x0 = x; b.x = x; b.rot = rot; b.amp = 0; b.t = 0; return b; };
const B = makeItem('letter', 'B', 'red'), L = makeItem('animal', 'lion'), N = makeItem('number', 3, 'blue'), Y = makeItem('color', 'yellow'), K = makeItem('letter', 'K', 'green');
put(N, balloonColorFor(N, 'blue'), 1060, 190, 0.05);
put(B, balloonColorFor(B, 'red'), 780, 250, -0.06);
put(L, balloonColorFor(L), 930, 330, 0.03);
put(K, balloonColorFor(K, 'green'), 1110, 430, 0.04);
put(Y, balloonColorFor(Y), 680, 450, -0.03);
for (let i = 0; i < 90; i++) { for (const b of st.balloons) { b.speed = 0; } st.update(1 / 60); }
st.draw();
document.body.dataset.ready = '1';
</script></body></html>
